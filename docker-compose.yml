services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authproxy
      POSTGRES_PASSWORD: authproxy
      POSTGRES_DB: authproxy
    ports:
      - "5432:5432"
    volumes:
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authproxy"]
      interval: 2s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
